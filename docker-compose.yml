services:
  redis:
    image: redis:7-alpine
    # Password is mandatory — no fallback to unauthenticated mode.
    # Use ./scripts/start.sh to auto-generate an ephemeral password, or
    # export REDIS_PASSWORD before calling docker compose.
    command: redis-server --requirepass "${REDIS_PASSWORD:-}" --save "" --appendonly no
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # Redis is internal only — not exposed to the host. The responder
    # reaches it via the compose network.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2GB

  responder:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data:ro # Mount the local data directory (certs, crls, responders) as read-only
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DATA_DIR=/data
      # Multi-endpoint examples (comma-separated):
      # - ENDPOINTS_OCSP=/ocsp,/responder
      # - ENDPOINTS_CRL=/,/crls,/CRL
      # - ENDPOINTS_CA=/,/cas,/CA
      # - ENDPOINTS_CHAIN=/,/chain,/chains
    depends_on:
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2GB
