services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_test_data:/data
    restart: unless-stopped

  responder:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./test-data:/data:ro
    environment:
      - REDIS_ADDR=redis:6379
      - DATA_DIR=/data
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_test_data:
